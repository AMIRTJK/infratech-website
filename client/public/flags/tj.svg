<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1400 700" width="1400" height="700">
  <rect width="1400" height="200" fill="#CC0000"/>
  <rect y="200" width="1400" height="300" fill="#FFFFFF"/>
  <rect y="500" width="1400" height="200" fill="#006600"/>
  <g fill="#F8C300" transform="translate(700, 350)">
    <!-- Crown -->
    <path d="M-90,60 C-60,70 60,70 90,60 L75,20 C60,40 30,45 0,45 C-30,45 -60,40 -75,20 Z"/>
    <path d="M-80,10 C-70,-20 -95,-60 -105,-80 C-75,-60 -50,-20 -40,15 C-25,-10 -5,-40 0,-70 C5,-40 25,-10 40,15 C50,-20 75,-60 105,-80 C95,-60 70,-20 80,10 C50,25 20,30 0,30 C-20,30 -50,25 -80,10 Z"/>
    <circle cx="0" cy="-75" r="8"/>
    <circle cx="-110" cy="-85" r="8"/>
    <circle cx="110" cy="-85" r="8"/>
    <!-- 7 Stars in an arc -->
    <g id="star">
      <polygon points="0,-120 4,-108 16,-108 7,-100 10,-88 0,-95 -10,-88 -7,-100 -16,-108 -4,-108"/>
    </g>
    <use xlink:href="#star" transform="rotate(25)"/>
    <use xlink:href="#star" transform="rotate(50)"/>
    <use xlink:href="#star" transform="rotate(75)"/>
    <use xlink:href="#star" transform="rotate(-25)"/>
    <use xlink:href="#star" transform="rotate(-50)"/>
    <use xlink:href="#star" transform="rotate(-75)"/>
  </g>
</svg>
